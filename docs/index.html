<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeamPulse — Meeting Intelligence for the Terminal</title>
  <meta name="description" content="TeamPulse reads your meeting transcripts and extracts decisions, tasks, risks, and owners using Gemini AI — right in your terminal. Tracks drift across meetings so nothing slips." />
  <meta property="og:title" content="TeamPulse — Meeting Intelligence for the Terminal" />
  <meta property="og:description" content="Stop re-discussing. Start shipping. TeamPulse keeps every decision, task, and risk in check." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FDF8F3;
      --surface:   #F5EDE0;
      --surface2:  #EDE0CE;
      --border:    #DCC8A8;
      --orange:    #D94A14;
      --orange-2:  #F06030;
      --orange-dim:#FDEADE;
      --brown:     #8B5A35;
      --text:      #1A0E08;
      --text-dim:  #7A5542;
      --text-muted:#B89070;
      --term-bg:   #0C0806;
      --term-surf: #161008;
      --term-surf2:#1E160A;
      --term-bdr:  #3A2A1A;
      --term-text: #F0E0C8;
      --term-muted:#5A4030;
      --green:     #5A8830;
      --red:       #C83010;
      --font-mono: 'JetBrains Mono', 'Cascadia Code', monospace;
      --font-sans: 'Inter', system-ui, sans-serif;
      --radius:    10px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--orange); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Nav ─────────────────────────────────────────────────────────────────── */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem; height: 58px;
      background: rgba(253,248,243,.93);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      display: flex; align-items: center; gap: .55rem;
      font-family: var(--font-mono); font-weight: 700;
      font-size: .95rem; color: var(--text);
      letter-spacing: -.4px;
    }
    .nav-logo strong { color: var(--orange); }

    .nav-links {
      display: flex; align-items: center; gap: 2rem; list-style: none;
    }
    .nav-links a {
      color: var(--text-dim); font-size: .875rem;
      font-weight: 500; transition: color .15s;
    }
    .nav-links a:hover { color: var(--text); text-decoration: none; }

    .btn {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .5rem 1.1rem; border-radius: 7px;
      font-size: .875rem; font-weight: 600;
      cursor: pointer; transition: all .15s; border: none;
      text-decoration: none !important; white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--orange); color: #fff; box-shadow: 0 2px 12px rgba(217,74,20,.3); }
    .btn-primary:hover { background: var(--orange-2); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--text-dim); }
    .btn-sm { padding: .35rem .8rem; font-size: .8rem; }

    /* ── Hero split ──────────────────────────────────────────────────────────── */
    .hero-wrap {
      max-width: 1200px; margin: 0 auto;
      padding: 5rem 2.5rem 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem; align-items: center;
    }

    .hero-left { max-width: 520px; }

    .badge {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .28rem .75rem;
      background: var(--orange-dim); border: 1px solid rgba(217,74,20,.35);
      border-radius: 100px; font-size: .72rem; font-weight: 700;
      color: var(--orange); letter-spacing: .4px;
      text-transform: uppercase; margin-bottom: 1.75rem;
    }

    .hero-left h1 {
      font-size: clamp(2.4rem, 5vw, 3.5rem);
      font-weight: 900;
      line-height: 1.06;
      letter-spacing: -2px;
      margin-bottom: 1.25rem;
      color: var(--text);
    }
    .hero-left h1 em {
      font-style: normal;
      color: var(--orange);
    }

    .hero-left p {
      font-size: 1.05rem;
      color: var(--text-dim);
      line-height: 1.65;
      margin-bottom: 2rem;
      max-width: 440px;
    }

    .hero-actions { display: flex; gap: .75rem; flex-wrap: wrap; }

    .hero-note {
      margin-top: 1.5rem;
      font-size: .78rem;
      color: var(--text-muted);
      display: flex; align-items: center; gap: .4rem;
    }

    /* ── Terminal ─────────────────────────────────────────────────────────────── */
    .terminal {
      background: var(--term-bg);
      border: 1px solid var(--term-bdr);
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.04);
    }

    .terminal-bar {
      display: flex; align-items: center; gap: .5rem;
      padding: .7rem 1rem;
      background: var(--term-surf);
      border-bottom: 1px solid var(--term-bdr);
    }

    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot-red { background: #ff5f57; }
    .dot-yellow { background: #febc2e; }
    .dot-green { background: #28c840; }

    .terminal-title {
      flex: 1; text-align: center;
      font-size: .72rem; color: var(--term-muted);
      font-family: var(--font-mono);
    }

    .tab-bar {
      display: flex; border-bottom: 1px solid var(--term-bdr);
      padding: 0 .75rem; background: var(--term-surf2);
    }
    .tab {
      padding: .45rem .85rem; font-size: .72rem;
      font-family: var(--font-mono); color: var(--term-muted);
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s; user-select: none;
    }
    .tab.active { color: var(--orange-2); border-color: var(--orange-2); }

    .terminal-body {
      padding: 1.1rem 1.4rem;
      font-family: var(--font-mono); font-size: .78rem;
      line-height: 1.7; overflow-x: auto;
      color: var(--term-text); min-height: 260px;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .t-prompt { color: var(--orange-2); }
    .t-cmd { color: var(--term-text); }
    .t-dim { color: var(--term-muted); }
    .t-green { color: #7ab84a; }
    .t-yellow { color: #c4883a; }
    .t-red { color: #d84a2a; }
    .t-cyan { color: #e08030; }
    .t-bold { font-weight: 700; }

    /* ── AI reasoning terminal ── */
    .t-user-line {
      display: flex; align-items: flex-start; gap: .6rem;
      margin-bottom: .9rem;
    }
    .t-user-icon {
      flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
      background: var(--orange); display: flex; align-items: center;
      justify-content: center; font-size: .6rem; font-weight: 700; color: #fff;
      margin-top: 1px;
    }
    .t-user-msg { color: var(--term-text); font-style: normal; }

    .t-think-block {
      margin: .6rem 0 .6rem 1.5rem;
      padding: .6rem .9rem;
      border-left: 2px solid var(--term-bdr);
      display: flex; flex-direction: column; gap: .3rem;
    }
    .t-think {
      color: #7a5a38; font-style: italic; font-size: .75rem; line-height: 1.5;
    }
    .t-think-step {
      color: #6a4a28; font-size: .72rem;
      display: flex; align-items: flex-start; gap: .4rem;
    }
    .t-think-step::before {
      content: '›'; color: #5a3a18; flex-shrink: 0;
    }

    .t-exec-block {
      margin: .7rem 0 .7rem 0;
      background: var(--term-surf2);
      border: 1px solid var(--term-bdr);
      border-radius: 6px; padding: .5rem .9rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .t-exec-label { color: #5a4030; font-size: .68rem; text-transform: uppercase; l
